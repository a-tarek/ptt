name: Verify npm auth

# Manual diagnostic. Run with: gh workflow run verify-npm-auth.yml
# Reports whether NPM_TOKEN reaches the runner, without cutting a release.
# Prints only the token's length and prefix class, never its value.

on:
  workflow_dispatch:

jobs:
  with-environment:
    name: Resolve secret (environment: npm-publish)
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Inspect token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "length: ${#NODE_AUTH_TOKEN}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "result: EMPTY - secret did not resolve"
          else
            case "$NODE_AUTH_TOKEN" in
              npm_*) echo "result: present, npm_ prefix" ;;
              *)     echo "result: present, unexpected prefix" ;;
            esac
          fi

      - name: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami && npm access list packages @atarek

  without-environment:
    name: Resolve secret (no environment)
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "length: ${#NODE_AUTH_TOKEN}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "result: EMPTY - secret did not resolve"
          else
            echo "result: present"
          fi

# touch to force GitHub to reparse this workflow
