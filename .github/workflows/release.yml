name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.7']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./...

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Stage npm binaries
        run: |
          # Copy binaries from goreleaser dist/ to npm/ directories
          cp dist/ptt_darwin_arm64_v8.0/ptt npm/platforms/darwin-arm64/bin/ptt
          cp dist/ptt_darwin_amd64_v1/ptt npm/platforms/darwin-amd64/bin/ptt
          cp dist/ptt_linux_arm64_v8.0/ptt npm/platforms/linux-arm64/bin/ptt
          cp dist/ptt_linux_amd64_v1/ptt npm/platforms/linux-amd64/bin/ptt

          # Make binaries executable
          chmod +x npm/platforms/*/bin/ptt

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Publish to npm
        run: bash scripts/publish-npm.sh ${{ steps.version.outputs.version }}

# Secrets required:
# - NPM_TOKEN: npm automation token for publishing @atarek/* packages
#   Create at: https://www.npmjs.com/settings/<username>/tokens
#   Add to repository: Settings -> Secrets and variables -> Actions -> New repository secret
