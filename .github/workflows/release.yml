name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC). Without this the runner
  # cannot mint the identity token npm exchanges for publish rights.
  id-token: write

jobs:
  test:
    name: Test before release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.7']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./...

  release:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        # Trusted publishing (OIDC) needs npm >= 11.5.1.
        run: npm install -g npm@latest

      - name: Verify OIDC prerequisites
        run: |
          # Fail fast: goreleaser cuts an immutable GitHub release, so a broken
          # publish setup must be caught before that, not after.
          npm --version
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ERROR: no OIDC token endpoint - 'id-token: write' is missing"
            exit 1
          fi
          echo "OIDC token endpoint present"

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Stage npm binaries
        run: |
          # Copy binaries from goreleaser dist/ to npm/ directories
          cp dist/ptt_darwin_arm64_v8.0/ptt npm/platforms/darwin-arm64/bin/ptt
          cp dist/ptt_darwin_amd64_v1/ptt npm/platforms/darwin-amd64/bin/ptt
          cp dist/ptt_linux_arm64_v8.0/ptt npm/platforms/linux-arm64/bin/ptt
          cp dist/ptt_linux_amd64_v1/ptt npm/platforms/linux-amd64/bin/ptt

          # Make binaries executable
          chmod +x npm/platforms/*/bin/ptt

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: auth comes from OIDC trusted publishing.
        run: bash scripts/publish-npm.sh ${{ steps.version.outputs.version }}

# Publishing uses npm trusted publishing (OIDC) - no NPM_TOKEN secret.
# Each of the 5 packages must have a trusted publisher configured on npmjs.com:
#   Package -> Settings -> Trusted publisher
#     Provider: GitHub Actions
#     Repository: a-tarek/ptt
#     Workflow: release.yml
#     Environment: (leave blank)
# Packages: @atarek/ptt, @atarek/ptt-{darwin,linux}-{arm64,amd64}
