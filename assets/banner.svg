<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">

  <!-- V10: dark-bg friendly, colored text: green ptt, yellow tagline, red manager -->
  <g transform="translate(185, 180) scale(1.45)">

    <!-- Outline -->
    <path d="M 5 -95 C 45 -100, 68 -75, 70 -40 C 72 -5, 60 20, 65 50 C 70 80, 50 108, 10 110 C -30 112, -60 90, -70 55 C -80 20, -75 -20, -65 -50 C -55 -80, -25 -92, 5 -95 Z" fill="#2B2520" />

    <!-- Body fill -->
    <path d="M 5 -88 C 40 -93, 61 -69, 63 -38 C 65 -7, 54 17, 58 45 C 62 73, 45 100, 10 102 C -25 104, -53 84, -63 51 C -73 18, -68 -17, -59 -46 C -50 -74, -22 -85, 5 -88 Z" fill="#BDB04A" />

    <!-- Shading -->
    <path d="M -59 -46 C -50 -74, -22 -85, 5 -88 C -12 -80, -35 -62, -44 -38 C -53 -14, -52 18, -46 45 C -40 68, -28 85, -5 95 C -25 104, -53 84, -63 51 C -73 18, -68 -17, -59 -46 Z" fill="#A89A35" opacity="0.4"/>

    <!-- Spots -->
    <circle cx="-28" cy="-40" r="5.5" fill="#8A7D28" opacity="0.5"/>
    <circle cx="35" cy="20" r="6" fill="#8A7D28" opacity="0.45"/>
    <circle cx="-20" cy="55" r="5" fill="#8A7D28" opacity="0.4"/>
    <circle cx="15" cy="-60" r="4" fill="#8A7D28" opacity="0.35"/>
    <circle cx="-42" cy="15" r="4.5" fill="#8A7D28" opacity="0.4"/>
    <circle cx="40" cy="60" r="3.5" fill="#8A7D28" opacity="0.35"/>

    <!-- Leaf -->
    <line x1="8" y1="-88" x2="12" y2="-112" stroke="#5B8C2A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 10 -108 C 2 -120, -8 -122, -10 -115 C -12 -108, -4 -104, 8 -106" fill="#7BB535" stroke="#5B8C2A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 12 -102 C 20 -112, 26 -110, 25 -104 C 24 -98, 18 -98, 13 -100" fill="#8DC63F" stroke="#5B8C2A" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="-16" cy="-15" r="7.5" fill="#2B2520"/>
    <circle cx="20" cy="-15" r="7.5" fill="#2B2520"/>

    <!-- Smile -->
    <path d="M -4 10 Q 4 20, 12 12" stroke="#2B2520" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Tie -->
    <path d="M -4 36 L 8 36 L 2 50 Z" fill="#2B2520"/>
    <path d="M -2 37 L 6 37 L 2 48 Z" fill="#C23B22"/>
    <path d="M 2 49 L -8 92 L 2 100 L 12 92 Z" fill="#2B2520"/>
    <path d="M 2 50 L -6 90 L 2 97 L 10 90 Z" fill="#C23B22"/>
    <line x1="-2" y1="62" x2="7" y2="60" stroke="#A02E1A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-4" y1="72" x2="7" y2="70" stroke="#A02E1A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-5" y1="82" x2="8" y2="80" stroke="#A02E1A" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- "ptt" — leaf green -->
  <text x="420" y="155" fill="#7BB535" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="82" font-weight="800" letter-spacing="4">ptt</text>

  <!-- "a potato worktree" — potato yellow, "manager" — tie red -->
  <text x="425" y="198" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="17">
    <tspan fill="#D4C456">a potato worktree </tspan><tspan fill="#D45545">manager</tspan>
  </text>
</svg>
